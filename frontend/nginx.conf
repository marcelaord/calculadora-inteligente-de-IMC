# BACKEND_PROXY se inyecta con envsubst en el arranque del contenedor:
#   - local:  http://backend:8080
#   - Render: https://<nombre-backend>.onrender.com
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS para resolver el hostname del backend (Docker local + publico).
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;

    # API REST -> backend
    location /api/ {
        proxy_pass ${BACKEND_PROXY};
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (dashboard en tiempo real)
    location /api/v1/ws/ {
        proxy_pass ${BACKEND_PROXY};
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Frontend estatico (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
